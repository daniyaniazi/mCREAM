  last_layer_mask: false
  concept_representation: group_soft
  side_dropout: false
  dropout_prob: 0.0
hyperparameters:
  learning_rate: 0.001
  lambda_weight: 1
  frozen_model1: true
trainer_param:
  max_epochs: 50
feature_cache_dir: ./data/fixed_u2u_feature_cache/cfmnist
save_u2u_reference: ./experiments/Complete_Concept_FMNIST/train_cbm/Standard_FashionMNIST/fixed_u2u_reference/CREAM_cfmnist_graph_free_u2u_reference/shared_u2u.pt
