# mCREAM Graph Ensemble - MIXED noise levels for reversal
# Each expert has a different noise level -> different BCE -> lambda can learn
# low=0.25, medium=0.50, high=0.75 deletion probability
mode: train_cbm
seed: 42
seeds: [42, 7, 1, 134, 89]
dataset_name: Complete_Concept_FMNIST

dataset_params:
  batch_size: 256
  workers: 2
  return_labels: true
  return_images: true

backbone_model: Standard_FashionMNIST

multi_expert:
  num_experts: 5
  noise_type: mixed_noise_levels
  expert_graph_paths:
    - dir: ./data/FashionMNIST/expert_graphs/ensemble/reversal_low
      expert_idx: 0
    - dir: ./data/FashionMNIST/expert_graphs/ensemble/reversal_medium
      expert_idx: 0
    - dir: ./data/FashionMNIST/expert_graphs/ensemble/reversal_high
      expert_idx: 0
    - dir: ./data/FashionMNIST/expert_graphs/ensemble/reversal_low
      expert_idx: 1
    - dir: ./data/FashionMNIST/expert_graphs/ensemble/reversal_high
      expert_idx: 1

hyperparameters_model2:
  num_classes: 10
  num_concepts: 11
  num_exogenous: 128
  num_side_channel: 40
  concept_representation: group_soft
  num_hidden_layers_in_maskedmlp: 0
  previous_model_output_size: 128
  side_dropout: true
  dropout_prob: 0.9

hyperparameters:
  learning_rate: 0.001
  lambda_weight: 1
  frozen_model1: true

trainer_param:
  max_epochs: 50

experiment_name: graph_ensemble_mixed_reversal

paths:
  default_root_dir: ./experiments/
  DAG_file: ./data/FashionMNIST/Complete_Concept_FMNIST_DAG.csv
  expert_graphs_dir: ./data/FashionMNIST/expert_graphs/graph_ensemble_mixed_reversal/
  input_model_path: ./pretrained_models/FMNIST/version_0/checkpoints/epoch=49-step=10750.ckpt
  softmax_mask: ./data/FashionMNIST/mutually_exclusive_relationships_COMPLETE.json
