# mCREAM Graph Ensemble - edge count: u2c 12 edges
# Expert m uses seed-m graph — same count, different random edge selection.
# 5 diverse graphs → 1 ensemble (compare with CREAM boxplot at same count).
mode: train_cbm
seed: 42
seeds: [42, 7, 1, 134, 89]
experiment_name: gensemble_edge_count_u2c_12edges
dataset_name: Complete_Concept_FMNIST

dataset_params:
  batch_size: 256
  workers: 2
  return_labels: true
  return_images: true

backbone_model: Standard_FashionMNIST

multi_expert:
  num_experts: 5
  noise_type: edge_count_multi_seed
  expert_dag_files:
    - ./data/FashionMNIST/edge_count_experiments/edge_count_u2c_12edges_seed0.csv
    - ./data/FashionMNIST/edge_count_experiments/edge_count_u2c_12edges_seed1.csv
    - ./data/FashionMNIST/edge_count_experiments/edge_count_u2c_12edges_seed2.csv
    - ./data/FashionMNIST/edge_count_experiments/edge_count_u2c_12edges_seed3.csv
    - ./data/FashionMNIST/edge_count_experiments/edge_count_u2c_12edges_seed4.csv

hyperparameters_model2:
  num_classes: 10
  num_concepts: 11
  num_exogenous: 128
  num_side_channel: 40
  concept_representation: group_soft
  num_hidden_layers_in_maskedmlp: 0
  previous_model_output_size: 128
  side_dropout: true
  dropout_prob: 0.9

hyperparameters:
  learning_rate: 0.001
  lambda_weight: 1
  frozen_model1: true

trainer_param:
  max_epochs: 50

paths:
  default_root_dir: ./experiments/
  DAG_file: ./data/FashionMNIST/Complete_Concept_FMNIST_DAG.csv
  expert_graphs_dir: ./data/FashionMNIST/expert_graphs/graph_ensemble_edge_count/u2c_12edges/
  input_model_path: ./pretrained_models/FMNIST/version_0/checkpoints/epoch=49-step=10750.ckpt
  softmax_mask: ./data/FashionMNIST/mutually_exclusive_relationships_COMPLETE.json
