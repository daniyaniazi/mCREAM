# Edge count experiment: u2c target=12 edges, seed=3
# Scenario 1: fixed edge count, random which edges → boxplot per count
mode: train_cbm
seed: 42
experiment_name: edge_count_u2c_12edges_seed3
dataset_name: Complete_Concept_FMNIST

dataset_params:
  batch_size: 256
  workers: 2
  return_labels: true
  return_images: true

model_name: Standard_FashionMNIST

hyperparameters_model2:
  num_classes: 10
  num_exogenous: 128
  num_side_channel: 40
  num_concepts: 11
  masking_algorithm: zuko
  num_hidden_layers_in_maskedmlp: 0
  previous_model_output_size: 128
  last_layer_mask: true
  concept_representation: group_soft
  side_dropout: true
  dropout_prob: 0.9

hyperparameters:
  learning_rate: 0.001
  lambda_weight: 1
  frozen_model1: true

trainer_param:
  max_epochs: 50

paths:
  default_root_dir: ./experiments/
  metric_dir: ./last_metrics/
  DAG_file: ./data/FashionMNIST/edge_count_experiments/edge_count_u2c_12edges_seed3.csv
  input_model_path: ./pretrained_models/FMNIST/version_0/checkpoints/epoch=49-step=10750.ckpt
  softmax_mask: ./data/FashionMNIST/mutually_exclusive_relationships_COMPLETE.json
