# CREAM on single expert graph (single-action noise)
# Standalone CREAM trained on one noisy graph — baseline for mCREAM ensemble comparison
# action=addition, noise_level=medium, expert=4

mode: train_cbm
seed: 42
seeds: [42, 7, 1, 134, 89]
dataset_name: Complete_Concept_FMNIST

dataset_params:
  batch_size: 256
  workers: 2
  return_labels: true
  return_images: true

model_name: Standard_FashionMNIST

hyperparameters_model2:
  num_classes: 10
  num_exogenous: 22
  num_side_channel: 0
  num_concepts: 11
  masking_algorithm: zuko
  num_hidden_layers_in_maskedmlp: 0
  previous_model_output_size: 128
  last_layer_mask: true
  concept_representation: group_soft
  side_dropout: false
  dropout_prob: 0.9

hyperparameters:
  learning_rate: 0.001
  lambda_weight: 1
  frozen_model1: true

trainer_param:
  max_epochs: 50

experiment_name: cream_noisy_addition_medium_expert4_no_side

paths:
  default_root_dir: ./experiments/
  metric_dir: ./last_metrics/
  DAG_file: ./data/FashionMNIST/expert_graphs/ensemble/addition_medium/cream_noisy_dags/expert_4.csv
  input_model_path: ./pretrained_models/FMNIST/version_0/checkpoints/epoch=49-step=10750.ckpt
  softmax_mask: ./data/FashionMNIST/mutually_exclusive_relationships_COMPLETE.json
