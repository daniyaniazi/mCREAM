# CREAM on single expert graph (single-action noise)
# Standalone CREAM trained on one noisy graph — baseline for mCREAM ensemble comparison
# action=addition, noise_level=high, expert=2

mode: train_cbm
seed: 42
seeds: [42, 7, 1, 134, 89]
dataset_name: CelebA

dataset_params:
  batch_size: 256
  workers: 2
  return_labels: true
  return_images: true
  class_name: unfair

model_name: Standard_CelebA

hyperparameters_model2:
  num_classes: 1
  num_exogenous: 75
  num_side_channel: 5
  num_concepts: 7
  masking_algorithm: zuko
  num_hidden_layers_in_maskedmlp: 0
  previous_model_output_size: 512
  last_layer_mask: true
  concept_representation: soft
  side_dropout: true
  dropout_prob: 0.1

hyperparameters:
  learning_rate: 0.001
  lambda_weight: 1
  frozen_model1: true

trainer_param:
  max_epochs: 20

experiment_name: cream_noisy_addition_high_expert2

paths:
  default_root_dir: ./experiments/
  metric_dir: ./last_metrics/
  DAG_file: ./data/CelebA/expert_graphs/ensemble/addition_high/cream_noisy_dags/expert_2.csv
  input_model_path: ./pretrained_models/CelebA/version_11/checkpoints/epoch=89-step=6840.ckpt
