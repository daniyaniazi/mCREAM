# mCREAM - GraphLearningMLP Aggregation (M=10, High) - CelebA
mode: train_cbm
seed: 42
seeds: [42, 7]
dataset_name: CelebA

dataset_params:
  batch_size: 256
  workers: 2
  class_name: unfair

backbone_model: Standard_CelebA

multi_expert:
  enabled: true
  num_experts: 10
  disagreement_level: high
  aggregation_type: mlp
  graph_regularization:
    prior_weight: 0.0
    sparsity_weight: 0.05
    sparsity_weight_c2y: 0.005
    acyclicity_weight: 0.0

  graph_lr: 0.05
  graph_u2c_lr: 0.1
  graph_c2y_lr: 0.2
  graph_warmup_epochs: 0
  separate_graph_opt: true

hyperparameters_model2:
  num_classes: 1
  num_concepts: 7
  num_exogenous: 75
  num_side_channel: 5
  concept_representation: soft
  num_hidden_layers_in_maskedmlp: 0
  previous_model_output_size: 512
  side_dropout: true
  dropout_prob: 0.1

hyperparameters:
  learning_rate: 0.001
  lambda_weight: 1
  frozen_model1: true

trainer_param:
  max_epochs: 20
  gradient_clip_val: null

experiment_name: graph_mlp_M10_high

paths:
  default_root_dir: ./experiments/
  metric_dir: ./last_metrics/
  DAG_file: ./data/CelebA/final_DAG_unfair.csv
  expert_graphs_dir: ./data/CelebA/expert_graphs/M10/high/
  input_model_path: ./pretrained_models/CelebA/version_11/checkpoints/epoch=89-step=6840.ckpt
