  learning_rate: 0.001
  lambda_weight: 1
  frozen_model1: true
trainer_param:
  max_epochs: 20
sanity_check:
  dataset: celeba
  graph_variant: random_same_edges
  description: Random True entries with the same edge count as original
  base_dag: ./data/CelebA/final_DAG_unfair.csv
