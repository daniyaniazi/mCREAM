mode: train_cbm
seed: 42
experiment_name: CREAM_celeba_graph_sanity/random_same_edges
dataset_name: CelebA
dataset_params:
  batch_size: 256
  workers: 2
  class_name: unfair
model_name: Standard_CelebA
paths:
  default_root_dir: ./experiments/
  metric_dir: ./last_metrics/
  DAG_file: ./data/CelebA/graph_sanity/final_DAG_unfair_random_same_edges.csv
  input_model_path: ./pretrained_models/CelebA/version_11/checkpoints/epoch=89-step=6840.ckpt
