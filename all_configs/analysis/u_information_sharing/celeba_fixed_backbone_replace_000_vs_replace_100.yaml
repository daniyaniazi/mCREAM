# Compare the replace_000 and replace_100 fixed-backbone-only CelebA runs.
# Checkpoint globs match the experiment paths built by simple_main.py.
dataset: CelebA

models:
  - name: replace_000
    config: all_configs/fixed_backbone/celeba_concept_concept_fixcount_topology_no_side_channel_fixed_backbone/CREAM_celeba_concept_concept_fixcount_topology_no_side_channel_fixed_backbone_only_replace_000.yaml
    checkpoint_glob: experiments/CelebA/train_cbm/Standard_CelebA/celeba_concept_concept_fixcount_topology_no_side_channel_fixed_backbone/CREAM_celeba_concept_concept_fixcount_topology_no_side_channel_fixed_backbone_only/replace_000/lightning_logs/version_*/checkpoints/*.ckpt

  - name: replace_100
    config: all_configs/fixed_backbone/celeba_concept_concept_fixcount_topology_no_side_channel_fixed_backbone/CREAM_celeba_concept_concept_fixcount_topology_no_side_channel_fixed_backbone_only_replace_100.yaml
    checkpoint_glob: experiments/CelebA/train_cbm/Standard_CelebA/celeba_concept_concept_fixcount_topology_no_side_channel_fixed_backbone/CREAM_celeba_concept_concept_fixcount_topology_no_side_channel_fixed_backbone_only/replace_100/lightning_logs/version_*/checkpoints/*.ckpt

output_dir: experiments/u_information_sharing/celeba_fixed_backbone_replace_000_vs_replace_100
device: cuda
probe_c_values: [0.01, 0.1, 1.0, 10.0]
bootstrap_repetitions: 500
pairs_per_concept: 100
