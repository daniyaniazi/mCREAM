# mCREAM Ensemble - CelebA - soft_weighted, reversal-only noise, medium level
# Run: python mcream_ensemble_main.py --config <this_file>
mode: train_cbm
seed: 42
seeds: [42, 7, 1, 134, 89]
dataset_name: CelebA

dataset_params:
  batch_size: 256
  workers: 2
  class_name: unfair

backbone_model: Standard_CelebA

multi_expert:
  num_experts: 5
  expert_mode: soft_edge
  ensemble_type: weighted
  noise_type: single_action
  action: reversal
  noise_level: medium

hyperparameters_model2:
  num_classes: 1
  num_concepts: 7
  num_exogenous: 75
  num_side_channel: 5
  concept_representation: soft
  num_hidden_layers_in_maskedmlp: 0
  previous_model_output_size: 512
  side_dropout: true
  dropout_prob: 0.1

hyperparameters:
  learning_rate: 0.001
  lambda_weight: 1
  frozen_model1: true

trainer_param:
  max_epochs: 20

experiment_name: ensemble_soft_weighted_reversal_medium

paths:
  default_root_dir: ./experiments/
  DAG_file: ./data/CelebA/final_DAG_unfair.csv
  expert_graphs_dir: ./data/CelebA/expert_graphs/ensemble/reversal_medium/
  input_model_path: ./pretrained_models/CelebA/version_11/checkpoints/epoch=89-step=6840.ckpt
